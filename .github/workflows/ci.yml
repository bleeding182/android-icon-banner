name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch push and its open pull request both trigger this; only the newest run per ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # AGP 9 supports JDK 17, so that is the floor the plugin has to build and run on.
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Already the default in v4; pinned so a future bump cannot silently drop it.
          validate-wrappers: true

      # The TestKit suite skips itself when no SDK is present (assumeTrue in IconBannerFixture), so
      # without this a runner missing the SDK would report a green build that tested nothing.
      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the functional tests would silently skip."; exit 1; }

      - name: Build and test the plugin
        run: ./gradlew -p plugin build

      # The JDK floor, asserted rather than assumed: AGP 9 supports JDK 17, so a class file above
      # major 61 is an UnsupportedClassVersionError (or a variant-resolution failure) for a consumer
      # on a supported daemon. Without a toolchain the level silently follows whichever JVM built it.
      - name: Assert the bytecode targets JDK 17
        run: |
          mapfile -t jars < <(find plugin/build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1 || { echo "Expected one plugin jar, found: ${jars[*]:-none}"; exit 1; }
          jar="${jars[0]}"
          mapfile -t classes < <(unzip -Z1 "$jar" '*.class' | sed 's/\.class$//; s|/|.|g')
          test "${#classes[@]}" -gt 0 || { echo "No classes in $jar."; exit 1; }
          majors="$(javap -verbose -cp "$jar" "${classes[@]}" | awk '/major version/ { print $3 }' | sort -u | tr '\n' ' ')"
          echo "$jar: class-file major version(s): $majors"
          test "$majors" = "61 " || { echo "Expected class-file major 61 (JDK 17) only."; exit 1; }

      # The real integration check: apply the plugin to an actual Android app and bannered variants.
      # The root build pins its daemon to JDK 25 (gradle/gradle-daemon-jvm.properties), so the
      # included plugin build has to *find* a 17 toolchain; JAVA_HOME is the one set up above.
      - name: Build the demo app
        run: >
          ./gradlew -Porg.gradle.java.installations.paths="$JAVA_HOME"
          :app:assembleDevDebug :app:assembleProdDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7

  # What a consumer actually resolves. The TestKit suite puts the plugin on the fixture's own
  # `buildscript` classpath, so `plugins { id(...) version ... }` — the marker POM, the module
  # metadata and its org.gradle.jvm.version — is never exercised there, which is exactly the
  # mechanism a wrong jvmTarget breaks. This job publishes to mavenLocal and resolves it by id and
  # version on the JDK 17 floor, from a project generated here so nothing in the repo can prop it up.
  consumer:
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: 0.0.1-consumer-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the consumer build cannot run."; exit 1; }

      - name: Publish the plugin to mavenLocal
        run: ./gradlew -p plugin publishToMavenLocal -PpluginVersion="$PLUGIN_VERSION"

      - name: Assert the module metadata declares JDK 17
        run: |
          module="$HOME/.m2/repository/io/github/bleeding182/icon-banner-gradle-plugin/$PLUGIN_VERSION/icon-banner-gradle-plugin-$PLUGIN_VERSION.module"
          test -f "$module" || { echo "No module metadata at $module"; exit 1; }
          grep -n '"org.gradle.jvm.version"' "$module"
          grep -q '"org.gradle.jvm.version": 17' "$module" \
            || { echo "Module metadata must declare org.gradle.jvm.version 17, or a JDK 17 daemon cannot select a variant."; exit 1; }
          marker="$HOME/.m2/repository/io/github/bleeding182/iconbanner/io.github.bleeding182.iconbanner.gradle.plugin/$PLUGIN_VERSION"
          test -d "$marker" || { echo "No plugin marker at $marker; plugins { id(...) version ... } cannot resolve."; exit 1; }

      - name: Generate a consumer project
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: |
          mkdir -p "$CONSUMER/src/main/res/drawable" "$CONSUMER/src/main/res/mipmap-anydpi-v26"

          cat > "$CONSUMER/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  mavenLocal() // the plugin under test, resolved by id and version like any consumer
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "consumer"
          EOF

          cat > "$CONSUMER/build.gradle.kts" <<EOF
          plugins {
              id("com.android.application") version "9.3.1"
              id("io.github.bleeding182.iconbanner") version "$PLUGIN_VERSION"
          }

          android {
              namespace = "com.example.consumer"
              compileSdk {
                  version = release(37)
              }
              defaultConfig {
                  minSdk = 24
              }
              buildTypes {
                  debug {
                      iconBanner {
                          text = "CI"
                          color = "#FF00FF" // a colour nothing else in the icon uses, for the assertion
                      }
                  }
              }
          }
          EOF

          cat > "$CONSUMER/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          org.gradle.configuration-cache=true
          android.useAndroidX=true
          EOF

          echo "sdk.dir=$ANDROID_HOME" > "$CONSUMER/local.properties"

          cat > "$CONSUMER/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="Consumer" />

          </manifest>
          EOF

          cat > "$CONSUMER/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > "$CONSUMER/src/main/res/drawable/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat > "$CONSUMER/src/main/res/drawable/ic_launcher_foreground.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

      # The repository's wrapper, but the generated project as the build root: it has no
      # gradle-daemon-jvm.properties of its own, so this runs on JAVA_HOME — JDK 17, the floor.
      - name: Build the consumer app
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: ./gradlew -p "$CONSUMER" assembleDebug

      - name: Assert the banner was generated
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: |
          generated="$CONSUMER/build/generated/res/generateDebugIconBanner/drawable/ic_launcher_foreground.xml"
          test -f "$generated" || { echo "No generated foreground at $generated"; exit 1; }
          grep -qi 'ff00ff' "$generated" \
            || { echo "The generated foreground has no banner in it:"; cat "$generated"; exit 1; }
          echo "Banner generated by the published plugin:"
          cat "$generated"
