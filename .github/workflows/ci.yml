name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A branch push and its open pull request both trigger this; only the newest run per ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # AGP 9 supports JDK 17, so that is the floor the plugin has to build and run on.
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Already the default in v4; pinned so a future bump cannot silently drop it.
          validate-wrappers: true

      # The TestKit suite skips itself when no SDK is present (assumeTrue in IconBannerFixture), so
      # without this a runner missing the SDK would report a green build that tested nothing.
      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the functional tests would silently skip."; exit 1; }

      - name: Build and test the plugin
        run: ./gradlew -p plugin build

      # The real integration check: apply the plugin to an actual Android app. assembleDebug covers
      # every flavor, which is one per kind of launcher icon — adaptive with a vector foreground,
      # adaptive with a raster one, legacy bitmaps alone, a plain vector — plus the unbannered prod.
      # The root build pins its daemon to JDK 25 (gradle/gradle-daemon-jvm.properties), so the
      # included plugin build has to *find* a 17 toolchain; JAVA_HOME is the one set up above.
      - name: Build the demo app
        run: >
          ./gradlew -Porg.gradle.java.installations.paths="$JAVA_HOME"
          :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7

  # What a user gets: the plugin as published, resolved by id and version from a project shaped like
  # a fresh Android Studio template, on the JDK 17 floor. The TestKit suite puts the plugin on its
  # fixtures' buildscript classpath, so the marker POM, the module metadata and its
  # org.gradle.jvm.version are never exercised there. .github/consumer/check.sh is the whole check —
  # including the JDK floor, class-file major 61 on the published jar — and the same one the Publish
  # workflow runs before it uploads anything.
  consumer:
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: 0.0.1-consumer-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      - name: Publish the plugin to a local repository
        run: >
          ./gradlew -p plugin publishToMavenLocal
          -PpluginVersion="$PLUGIN_VERSION" -Dmaven.repo.local="$RUNNER_TEMP/repo"

      # The consumer has no gradle-daemon-jvm.properties, so it builds on JAVA_HOME: 17, the floor.
      - name: Build a consumer project against it
        run: .github/consumer/check.sh "$PLUGIN_VERSION" "$RUNNER_TEMP/repo" "$RUNNER_TEMP/consumer"
