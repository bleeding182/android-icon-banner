name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to GitHub Packages, e.g. 0.0.1-SNAPSHOT"
        required: false
        default: "0.0.1-SNAPSHOT"

permissions:
  contents: read
  packages: write # GITHUB_TOKEN is enough to publish; no personal access token needed.

jobs:
  # Snapshots and releases both land here. Reading them needs a read:packages token, which is why
  # the Plugin Portal below is the one consumers are meant to use.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the functional tests would silently skip."; exit 1; }

      # A tag publishes its own version; a manual run publishes whatever it was given.
      - name: Resolve the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Test before publishing
        run: ./gradlew -p plugin build -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        run: >
          ./gradlew -p plugin publishAllPublicationsToGitHubPackagesRepository
          -PpluginVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags only: the Portal rejects SNAPSHOT versions, and a published version cannot be replaced.
  portal:
    if: github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the functional tests would silently skip."; exit 1; }

      - name: Publish to the Gradle Plugin Portal
        run: ./gradlew -p plugin publishPlugins -PpluginVersion=${GITHUB_REF_NAME#v}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
