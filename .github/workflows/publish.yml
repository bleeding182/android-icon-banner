name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Snapshot version to publish to GitHub Packages; must end in -SNAPSHOT"
        required: false
        default: "0.0.4-SNAPSHOT"

# Nothing workflow-wide: `packages: write` here would hand the token to the Portal job too.
permissions: {}

# One publish at a time, repository-wide. Two tags pushed together would otherwise upload
# concurrently, and a Plugin Portal version cannot be replaced once it exists. A queued run waits
# instead of being cancelled, because cancelling mid-upload is the one state with no recovery.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Everything that can fail before an upload, run once on one build: the tests, then the published
  # artifacts themselves through .github/consumer/check.sh, the same consumer check CI runs. The
  # artifacts are handed on, and each publishing job proves it is uploading these bytes and no others.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The single source of truth for what this run publishes; the jobs below consume it rather
      # than deriving the version a second time from the ref.
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # The floor the plugin supports, so the release path runs on it too. The bytecode level
          # itself comes from the toolchain in plugin/build.gradle.kts, not from this.
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Default is already true for v4; pinned explicitly so a future bump cannot drop it. This
          # checks the checked-in gradle-wrapper.jar against known-good hashes, which is a different
          # guarantee from distributionSha256Sum in gradle-wrapper.properties (that one pins the
          # distribution the wrapper downloads).
          validate-wrappers: true

      - name: Require an Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME" \
            || { echo "No Android SDK on this runner; the functional tests would silently skip."; exit 1; }

      # A tag push publishes its own version; a manual run publishes the snapshot it was given. A
      # manual run may not take a release number, nor a tag's (even when started on a tag ref): that
      # version would then exist on GitHub Packages, and the real tag push would 409 there and never
      # reach the Portal. The input is attacker-controllable text, so it goes through the environment
      # rather than being interpolated into the script, and is checked before it reaches a command line.
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
            case "$version" in
              *-SNAPSHOT) ;;
              *)
                echo "Refusing to publish '$version' from a manual run: only -SNAPSHOT versions." >&2
                exit 1
                ;;
            esac
          fi
          case "$version" in
            "" | *[!A-Za-z0-9._-]* )
              echo "Refusing to publish '$version': expected only [A-Za-z0-9._-]." >&2
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Test, and publish to a local repository
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >
          ./gradlew -p plugin build publishToMavenLocal
          -PpluginVersion="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/tested"

      # Also guards the JDK floor (class-file major 61, module metadata declaring 17) on these exact
      # files. Cheaper to fail here than to burn a version.
      - name: Build a consumer project against the artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: .github/consumer/check.sh "$VERSION" "$RUNNER_TEMP/tested" "$RUNNER_TEMP/consumer"

      - name: Hand the tested artifacts on
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-artifacts
          path: ${{ runner.temp }}/tested
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Snapshots and releases both land here. Reading them needs a read:packages token, which is why
  # the Plugin Portal below is the one consumers are meant to use.
  packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN is enough to publish; no personal access token needed.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-artifacts
          path: ${{ runner.temp }}/tested

      # Gradle's publish task builds what it uploads, so this job builds it here first and compares.
      # The build is reproducible; a mismatch means the bytes about to go out are not the ones
      # tested, and stops the run before anything is published. The upload below reuses these
      # task outputs, up to date, rather than building a third time.
      - name: Prove the upload is the tested build
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./gradlew -p plugin publishToMavenLocal -PpluginVersion="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/rebuilt"
          .github/same-artifacts.sh "$RUNNER_TEMP/tested" "$RUNNER_TEMP/rebuilt"

      # Runs the Portal's own checks on the artifacts and metadata without uploading anything, so a
      # release the Portal would refuse fails before anything has been published anywhere — a Portal
      # version cannot be replaced, and GitHub Packages returns 409 for an existing release version,
      # which makes a re-run after a partial failure unpleasant. --validate-only uploads nothing but
      # the plugin-publish plugin still demands the credentials, so they are scoped to this one step.
      # Only for a tag push: --validate-only rejects -SNAPSHOT versions outright, and a tag push is
      # exactly when the portal job below runs.
      - name: Validate the Plugin Portal release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin publishPlugins --validate-only -PpluginVersion="$VERSION"

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew -p plugin publishAllPublicationsToGitHubPackagesRepository
          -PpluginVersion="$VERSION"

  # Tag pushes only: the Portal rejects SNAPSHOT versions, and a published version cannot be
  # replaced. `github.ref_type == 'tag'` alone is not enough — the workflow_dispatch ref picker lists
  # tags, so a manual run started on a tag would publish the tag version here while the job above
  # published the dispatch input: two versions from one run, and this one unrepeatable.
  portal:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-artifacts
          path: ${{ runner.temp }}/tested

      # No Android SDK check and no tests here: the build job ran them on these bytes, and every
      # avoidable step before an irreversible upload is one more way to end up in the "GitHub
      # Packages published, Portal not" state. This comparison is the one that is not avoidable.
      - name: Prove the upload is the tested build
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./gradlew -p plugin publishToMavenLocal -PpluginVersion="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/rebuilt"
          .github/same-artifacts.sh "$RUNNER_TEMP/tested" "$RUNNER_TEMP/rebuilt"

      - name: Publish to the Gradle Plugin Portal
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin publishPlugins -PpluginVersion="$VERSION"
